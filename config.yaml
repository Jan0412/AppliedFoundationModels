models:
  siglip:
    model_id: "google/siglip2-base-patch16-224"
    device: "auto"          # "auto" | "cuda" | "cpu"
    batch_size: 256

  sam:
    model_id: "facebook/sam3"
    device: "auto"
    threshold: 0.5
    mask_threshold: 0.5

  vggt_omega:
    model_id: "facebook/VGGT-Omega"
    checkpoint: "vggt_omega_1b_512.pt"
    device: "cuda"
    image_resolution: 512
    preprocess_mode: "balanced"
    max_frames: 120
    confidence_threshold: 3.0   # zero depth pixels at or below this conf when writing PNGs
    depth_scale: 1000.0          # PNG encode/decode only; VGGT geometry is still up-to-scale

reconstruct:
  backend: "vggt_omega"   # "vggt_omega" | "mock" (ScanNet GT passthrough)


indexing:
  db_path: "data/lancedb"
  batch_size: 256        # optional — overrides models.siglip.batch_size

query:
  retrieval_mode: "dynamic"   # "topk" = legacy fixed-k | "dynamic" = Otsu-sized pool
  top_k_final: 5              # results kept after detector rerank (per-query overridable)
  strategy: "tail"            # Otsu variant for the pool threshold; "plain" keeps ~60% of frames
  min_k: 10                   # pool floor + fallback size when the η gate fires
  max_k: 400                  # pool cap
  min_separability: 0.75      # Otsu-η gate; uniform baseline (see notebooks/SimilarityHistogram.ipynb)
  n_diverse: 10               # viewpoint-diverse frames fed to the detector
  patch_frac: 0.2             # central-patch fraction for the robust look-at depth

projection:
  # mode selects how back-projected points become 3D object(s):
  #   simple            = no DBSCAN; keep all points as one object (looser box, no noise rejection)
  #   cluster_single    = DBSCAN, largest cluster -> one fused object (default; best for unique-object queries)
  #   cluster_instances = DBSCAN, one object per cluster (most consensus first)
  mode: "cluster_single"
  max_instances: null         # cap in cluster_instances mode (null = keep all clusters)
  min_instance_size: 50       # drop clusters smaller than this many points (post-voxel; cluster_instances only)
  voxel: 0.02                 # voxel edge (m) for pre-cluster downsample; <=0 disables
  cluster_eps: 0.05           # DBSCAN radius (m); larger merges nearby instances (cluster_* modes)
  cluster_min_samples: 10     # DBSCAN core-point neighbour count; larger = stricter (cluster_* modes)
  bbox_percentile: [2.0, 98.0] # [low, high] percentile clamp for robust bounding box

ui:
  port: 8080
  cache_dir: "data/scene_cache"   # npz cache of built scene point clouds
  ingest_dir: "data/scenes"       # uploaded videos + their extracted frames
  scene_n_frames: 250             # frames back-projected into the background cloud
  voxel: 0.02                     # cloud downsample edge (m); also the render point size
  extract_fps: 2.0                # frames sampled per second of uploaded video
  extract_max_frames: 300         # hard cap on frames taken from one video
